  <rect class="o" x="96" y="146" width="208" height="26" rx="12" fill="#b8322e"/>
  <g fill="#e0b84a"><circle cx="122" cy="159" r="4"/><circle cx="148" cy="159" r="4"/><circle cx="174" cy="159" r="4"/><circle cx="200" cy="159" r="4"/><circle cx="226" cy="159" r="4"/><circle cx="252" cy="159" r="4"/><circle cx="278" cy="159" r="4"/></g>

